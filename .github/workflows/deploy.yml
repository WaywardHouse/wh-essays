# This site is published as part of wayward.house by the hub repo
# (WaywardHouse/waywardhouse.github.io), which renders it into /<essays|signals>/.
#
# On push, ask the hub to rebuild so edits go live in a few minutes.
# Optional: needs secret HUB_DISPATCH_TOKEN (fine-grained PAT, repo
# waywardhouse.github.io, permission "Contents: read & write").
# Without it, the hub still picks up changes on its next push or its daily build.

name: Rebuild wayward.house

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hub rebuild
        env:
          TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HUB_DISPATCH_TOKEN not set — hub will pick this up on its next build (daily at the latest)."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/WaywardHouse/waywardhouse.github.io/dispatches \
            -d '{"event_type":"subsite-updated"}'
